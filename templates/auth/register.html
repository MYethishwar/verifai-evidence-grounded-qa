{% extends 'auth/_auth_layout.html' %}
{% block title %}Request access{% endblock %}
{% block card %}
<h1>Request access</h1>
<p class="vf-sub">Create your account. An administrator reviews new requests before first sign-in.</p>
<form method="POST" action="{{ url_for('auth.register') }}" novalidate>
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label" for="name">Full name</label>
      <div class="vf-input-icon"><i class="fas fa-id-badge"></i><input type="text" id="name" name="name" class="form-control" autocomplete="name" required></div>
    </div>
    <div class="col-sm-6">
      <label class="form-label" for="username">Username</label>
      <div class="vf-input-icon"><i class="fas fa-user"></i><input type="text" id="username" name="username" class="form-control" autocomplete="username" required></div>
    </div>
    <div class="col-sm-6">
      <label class="form-label" for="mobile">Mobile</label>
      <div class="vf-input-icon"><i class="fas fa-phone"></i><input type="tel" id="mobile" name="mobile" class="form-control" autocomplete="tel" required></div>
    </div>
    <div class="col-12">
      <label class="form-label" for="email">Work email</label>
      <div class="vf-input-icon"><i class="fas fa-envelope"></i><input type="email" id="email" name="email" class="form-control" autocomplete="email" required></div>
    </div>
    <div class="col-sm-6">
      <label class="form-label" for="password">Password</label>
      <div class="vf-input-icon"><i class="fas fa-lock"></i><input type="password" id="password" name="password" class="form-control" autocomplete="new-password" required></div>
    </div>
    <div class="col-sm-6">
      <label class="form-label" for="confirm_password">Confirm password</label>
      <div class="vf-input-icon"><i class="fas fa-lock"></i><input type="password" id="confirm_password" name="confirm_password" class="form-control" autocomplete="new-password" required></div>
    </div>
  </div>
  <button type="submit" class="vf-btn w-100 mt-4" style="padding:11px !important;">Request access</button>
</form>
<p class="vf-small vf-muted text-center mt-4 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
{% endblock %}
